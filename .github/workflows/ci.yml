name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Run backend tests
        run: pytest -q

      - name: Audit Python dependencies
        id: dependency-audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          set +e
          pip-audit -r requirements.txt --format=json --output=pip-audit-report.json
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning::pip-audit found known vulnerabilities in the pinned FaceNet runtime dependencies. See pip-audit-report.json in the workflow artifact."
          fi
          exit 0

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-dependency-audit-${{ github.sha }}
          path: backend/pip-audit-report.json
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Test and Build Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: bun run test

      - name: Lint frontend
        run: bun run lint

      - name: Build frontend
        run: bun run build

  mobile:
    name: Analyze Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://api.ai-facial-attendance.app' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Build APK smoke test
        # CI has no production keystore. This validates compilation only;
        # distributable APKs come from the stable-signed mobile-release workflow.
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
